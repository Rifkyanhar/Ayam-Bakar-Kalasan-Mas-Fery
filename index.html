<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalasan Mas Fery — Pesan Menu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E6B3C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalasan Mas Fery">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --yellow:#F2A900;
  --yellow-deep:#D98E00;
  --cream:#FFF7E6;
  --green:#1E6B3C;
  --green-deep:#134A29;
  --red:#B8322A;
  --ink:#2A2118;
  --paper:#FFFDF8;
  --line:#E8DCC0;
  --gray:#8A7F6C;
  --radius:14px;
  --shadow:0 4px 18px rgba(43,33,15,0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
}
h1,h2,h3,.brand{font-family:'Baloo 2','Inter',sans-serif;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,0.06);position:relative;padding-bottom:24px;}
#app.wide{max-width:960px;}

/* Header */
.topbar{
  background:linear-gradient(135deg,var(--green) 0%, var(--green-deep) 100%);
  color:#fff;padding:18px 20px 22px;position:relative;overflow:hidden;
}
.topbar::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;background:rgba(242,169,0,0.25);border-radius:50%;}
.topbar .eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:0.85;font-weight:600;}
.topbar h1{margin:2px 0 0;font-size:22px;font-weight:700;}
.topbar .sub{font-size:13px;opacity:0.9;margin-top:2px;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.back-btn{background:rgba(255,255,255,0.18);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.back-btn:active{background:rgba(255,255,255,0.32);}
.staff-back-btn{
  background:var(--green-deep);color:#fff;border:none;border-radius:100px;
  padding:9px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.staff-back-btn:active{background:var(--green);}

.content{padding:20px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card h3{margin:0 0 8px;font-size:16px;color:var(--green-deep);}
.muted{color:var(--gray);font-size:13px;}
.pill{display:inline-block;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;}
.pill.yellow{background:#FDF0D5;color:var(--yellow-deep);}
.pill.green{background:#E4F3E9;color:var(--green-deep);}
.pill.red{background:#FBE7E5;color:var(--red);}
.pill.gray{background:#F0EDE5;color:var(--gray);}

.btn{
  display:block;width:100%;padding:14px 16px;border-radius:12px;border:none;
  font-size:15px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit;
  transition:transform .05s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:disabled{background:#C9C2B3;cursor:not-allowed;}
.btn-outline{background:#fff;color:var(--green-deep);border:2px solid var(--green);}
.btn-yellow{background:var(--yellow);color:#3A2600;}
.btn-red{background:var(--red);color:#fff;}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:9px;}
.btn-ghost{background:transparent;color:var(--green-deep);border:1px dashed var(--line);}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.table-chip{
  background:var(--cream);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 6px;text-align:center;cursor:pointer;font-weight:700;color:var(--green-deep);font-size:14px;
}
.table-chip:active{background:#FDF0D5;border-color:var(--yellow);}
.table-chip.special{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}

.type-card{
  display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;cursor:pointer;background:#fff;
}
.type-card .icon{font-size:26px;}
.type-card b{display:block;font-size:15px;}
.type-card span{font-size:12.5px;color:var(--gray);}
.type-card.disabled{opacity:0.5;cursor:not-allowed;}

.menu-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.menu-item-disabled{opacity:0.55;filter:grayscale(0.4);}
.menu-item:last-child{border-bottom:none;}
.menu-item .emoji{font-size:34px;width:48px;text-align:center;flex-shrink:0;}
.menu-item .photo-img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--cream);border:1px solid var(--line);}
.menu-item .info{flex:1;min-width:0;}
.menu-item .info b{font-size:14.5px;}
.menu-item .info .desc{font-size:12.5px;color:var(--gray);}
.menu-item .price{font-size:13.5px;color:var(--red);font-weight:700;margin-top:2px;}
.qty-box{display:flex;align-items:center;gap:8px;margin-top:6px;}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--green);background:#fff;color:var(--green-deep);font-weight:700;cursor:pointer;font-size:15px;line-height:1;}
.qty-btn:active{background:var(--cream);}
.qty-num{min-width:20px;text-align:center;font-weight:700;}
.note-input{
  width:100%;margin-top:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;
  font-size:13px;font-family:inherit;background:var(--cream);
}

.category-tabs{display:flex;gap:8px;margin-bottom:12px;}
.category-tabs button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;color:var(--gray);}
.category-tabs button.active{background:var(--green);border-color:var(--green);color:#fff;}

.cart-fab{
  position:sticky;bottom:0;left:0;right:0;background:var(--green-deep);color:#fff;
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  border-radius:16px 16px 0 0;margin-top:12px;
}
.cart-fab b{font-size:15px;}
.cart-fab .go{background:var(--yellow);color:#3A2600;padding:8px 16px;border-radius:9px;font-weight:700;border:none;font-size:13.5px;cursor:pointer;}

input[type=text], input[type=tel], input[type=number], textarea, select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;
  font-family:inherit;background:#fff;color:var(--ink);
}
textarea{resize:vertical;min-height:56px;}
label{font-size:13px;font-weight:600;color:var(--ink);display:block;margin:10px 0 5px;}
.field{margin-bottom:4px;}

.upload-box{
  border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;
  color:var(--gray);font-size:13px;background:var(--cream);
}
.upload-preview{width:100%;border-radius:10px;margin-top:10px;max-height:220px;object-fit:contain;background:#f5f0e2;}

.pay-option{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:12px;padding:13px;margin-bottom:9px;cursor:pointer;}
.pay-option.selected{border-color:var(--green);background:#F3FAF5;}
.pay-option .icon{font-size:22px;}
.pay-option b{font-size:14px;}
.pay-option span{font-size:12px;color:var(--gray);}

.banner{border-radius:12px;padding:13px 14px;font-size:13.5px;margin-bottom:12px;line-height:1.5;}
.banner.warn{background:#FDF3E3;border:1px solid #F3D89A;color:#7A5300;}
.banner.error{background:#FBE7E5;border:1px solid #F0B4AD;color:#8A241C;}
.banner.ok{background:#E4F3E9;border:1px solid #A9D9BC;color:var(--green-deep);}

.queue-hero{text-align:center;padding:26px 10px 10px;}

/* Review prompt */
.review-card{text-align:center;}
.star-row{display:flex;justify-content:center;gap:8px;margin:14px 0 6px;}
.star-btn{font-size:36px;background:none;border:none;cursor:pointer;line-height:1;padding:2px;color:#D8D0BE;transition:transform .1s ease;}
.star-btn.filled{color:var(--yellow);}
.star-btn:active{transform:scale(1.15);}
.review-textarea{margin-top:12px;}
.queue-num{font-family:'Baloo 2';font-size:56px;font-weight:800;color:var(--green-deep);letter-spacing:2px;}
.status-track{display:flex;justify-content:space-between;margin:22px 0 6px;position:relative;}
.status-track::before{content:"";position:absolute;top:14px;left:8%;right:8%;height:3px;background:var(--line);z-index:0;}
.status-step{flex:1;text-align:center;position:relative;z-index:1;}
.status-dot{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--line);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.status-step.done .status-dot{background:var(--green);border-color:var(--green);color:#fff;}
.status-step.current .status-dot{background:var(--yellow);border-color:var(--yellow-deep);color:#3A2600;}
.status-step small{font-size:11px;color:var(--gray);display:block;}
.status-step.done small, .status-step.current small{color:var(--ink);font-weight:600;}

/* Role select / home */
.role-hero{background:linear-gradient(160deg,var(--yellow) 0%, var(--yellow-deep) 100%);padding:34px 20px 60px;text-align:center;color:#3A2600;position:relative;}
.role-hero .chicken{font-size:44px;}
.role-hero h1{margin:6px 0 0;font-size:24px;}
.role-hero p{font-size:13px;opacity:0.85;margin:6px 0 0;}
.role-cards{margin:-40px 18px 0;position:relative;z-index:2;}
.role-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;cursor:pointer;border:1px solid var(--line);}
.role-card .icon{font-size:30px;width:44px;text-align:center;}
.role-card b{font-size:15px;display:block;}
.role-card span{font-size:12.5px;color:var(--gray);}

/* Kitchen & Cashier dashboards */
.dash-header{display:flex;justify-content:space-between;align-items:center;background:var(--green-deep);color:#fff;padding:16px 20px;}
.dash-header h2{margin:0;font-size:18px;}
.dash-tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
.dash-tabs button{flex:1;padding:12px 6px;background:none;border:none;font-weight:600;color:var(--gray);font-size:13px;cursor:pointer;border-bottom:3px solid transparent;}
.dash-tabs button.active{color:var(--green-deep);border-bottom-color:var(--green);}
.order-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 20px;box-shadow:var(--shadow);}
.order-card .row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.order-card .qnum{font-family:'Baloo 2';font-size:22px;font-weight:800;color:var(--green-deep);}
.order-card .meta{font-size:12px;color:var(--gray);}
.order-items{font-size:13.5px;margin:8px 0;}
.order-items div{padding:3px 0;border-bottom:1px dashed var(--line);}
.order-items div:last-child{border-bottom:none;}
.note-tag{background:#FDF0D5;color:#7A5300;font-size:11.5px;padding:2px 6px;border-radius:6px;margin-left:4px;}
.action-row{display:flex;gap:8px;margin-top:10px;}
.action-row .btn{flex:1;}
.proof-thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;}

.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px;}
.qr-cell{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:#fff;}
.qr-cell b{display:block;margin-top:6px;font-size:13px;}
.qr-cell canvas, .qr-cell img{margin:0 auto;}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:12px;margin:14px 20px;background:#fff;}
.switch{position:relative;width:46px;height:26px;}
.switch input{display:none;}
.slider{position:absolute;inset:0;background:#D8D0BE;border-radius:20px;cursor:pointer;transition:.2s;}
.slider::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .slider{background:var(--green);}
input:checked + .slider::before{transform:translateX(20px);}

.empty-state{text-align:center;padding:50px 20px;color:var(--gray);}
.empty-state .em{font-size:40px;display:block;margin-bottom:10px;}

@media print{
  body *{visibility:hidden;}
  .printable, .printable *{visibility:visible;}
  .printable{position:absolute;top:0;left:0;width:100%;}
}
.hidden{display:none !important;}
.lightbox-overlay{
  position:fixed;inset:0;background:rgba(10,8,4,0.94);z-index:999;
  display:flex;align-items:center;justify-content:center;padding:20px;
  overflow:auto;touch-action:pinch-zoom;
}
.lightbox-img{max-width:100%;max-height:none;width:100%;border-radius:8px;background:#fff;}
.lightbox-close{position:fixed;top:16px;right:16px;z-index:1000;width:38px;height:38px;font-size:18px;background:rgba(255,255,255,0.15);}
.lightbox-hint{position:fixed;top:18px;left:16px;color:#fff;font-size:12.5px;opacity:0.85;z-index:1000;background:rgba(255,255,255,0.12);padding:6px 10px;border-radius:8px;}
.file-input-vh{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
a{color:var(--green-deep);}
.footer-note{text-align:center;font-size:11.5px;color:var(--gray);padding:14px 20px 0;}

/* Beranda (customer home dashboard) */
.beranda-top{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--green-deep);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:5;
}
.beranda-brand{font-family:'Baloo 2';font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.beranda-brand img{width:28px;height:28px;border-radius:8px;object-fit:cover;background:#fff;}
.bell-btn{position:relative;background:rgba(255,255,255,0.15);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;}
.bell-dot{position:absolute;top:6px;right:7px;width:9px;height:9px;background:var(--red);border-radius:50%;border:1.5px solid var(--green-deep);}
.beranda-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
.beranda-action{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 8px;
  text-align:center;cursor:pointer;box-shadow:var(--shadow);
}
.beranda-action .icon{font-size:30px;margin-bottom:8px;}
.beranda-action b{font-size:12.5px;display:block;line-height:1.3;}
.staff-link{text-align:center;font-size:12px;color:var(--gray);margin-top:22px;}

/* PIN gate screens */
.pin-screen{min-height:100vh;background:#181818;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.pin-logo{font-size:56px;margin-bottom:6px;}
.pin-title{color:var(--yellow);font-family:'Baloo 2';font-size:24px;margin:6px 0 0;}
.pin-sub{color:#999;font-size:13px;margin:4px 0 28px;}
.pin-card{background:#242424;border:1px solid #3a3a3a;border-radius:16px;padding:22px;width:100%;max-width:320px;box-sizing:border-box;}
.pin-label{color:#ccc;font-size:13px;display:block;margin-bottom:10px;text-align:left;}
.pin-input{
  width:100%;padding:14px;border-radius:10px;border:1.5px solid #3a3a3a;background:#181818;color:#fff;
  font-size:26px;text-align:center;letter-spacing:14px;font-weight:700;box-sizing:border-box;
}
.pin-back{color:#888;font-size:12.5px;margin-top:18px;display:inline-block;}

/* Camera scanner */
.scan-video-wrap{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;}
.scan-video-wrap video{width:100%;display:block;}
.scan-frame{position:absolute;inset:12%;border:3px solid var(--yellow);border-radius:16px;pointer-events:none;}

/* Google login button (customer) */
.google-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:#2A2118;border:1.5px solid var(--line);border-radius:12px;
  padding:13px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;
}
.google-btn:active{background:var(--cream);}
.auth-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--gray);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line);}

/* Google pending request card (cashier) */
.greq-card{display:flex;align-items:center;gap:12px;}
.greq-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--cream);flex-shrink:0;border:1.5px solid var(--line);}
.greq-avatar.empty{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gray);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ CONFIG ============ */
const RESTO = { name: "Ayam Bakar & Goreng Kalasan Mas Fery", lat: -6.1820389, lng: 106.6344833, wa: "085773144582", addr: "Jl. Soleh Ali No. 3 Kavling Pasar Anyar" };
/* Nilai AWAL/default saja — resto bisa mengganti sendiri lewat Panel Kasir
   > Pengaturan (link ulasan Google Maps & info rekening/e-wallet), tidak
   perlu edit kode lagi setelah web app ini pertama kali di-deploy. */
const DEFAULT_GOOGLE_REVIEW_LINK = "https://maps.app.goo.gl/XXyNHnfwyzSV33SV8";
const DEFAULT_PAYMENT_INFO = {
  bank1Name: "BCA", bank1Number: "4090708835",
  bank2Name: "BNI", bank2Number: "2052343385",
  bankHolder: "MOCHAMMAD RIFKI ANHAR",
  ewalletNumber: "0852-9007-8889", ewalletHolder: "MOCHAMMAD RIFKI ANHAR"
};
const REVIEW_DELAY_MS = 20 * 60 * 1000; // 20 menit setelah pesanan selesai
const DEFAULT_GEOFENCE_TOLERANCE_M = 10;
const DEFAULT_TABLE_COUNT = 30;
const MAX_TABLE_COUNT = 30;
const MAX_MENU_ITEMS = 30;
let TABLE_COUNT = DEFAULT_TABLE_COUNT; // bisa diubah kasir lewat Pengaturan (maks 30)

/* MENU_SEED = data awal (dipakai sekali untuk mengisi database pertama kali,
   dan sebagai cadangan kalau Firebase belum siap). Setelah itu, menu asli
   yang dipakai aplikasi ada di variabel MENU (huruf besar, tapi BUKAN
   const) — datanya diambil live dari Firebase (menuItems) dan bisa
   ditambah/diedit/dihapus kasir dari Panel Kasir > Kelola Menu, lengkap
   dengan foto. Nama variabel MENU sengaja dipertahankan sama supaya semua
   kode lain di file ini (MENU.find/MENU.filter) tidak perlu diubah. */
const MENU_SEED = [
  { id:"u1", cat:"utama", emoji:"🍗", name:"Ayam Bakar/Goreng", desc:"Menu utama, tanpa nasi", price:19000 },
  { id:"u2", cat:"utama", emoji:"🍲", name:"Sop Iga", desc:"Sop iga sapi hangat", price:27000 },
  { id:"u3", cat:"utama", emoji:"🍲", name:"Sop Iga Bakar", desc:"Sop iga sapi bakar", price:30000 },
  { id:"u4", cat:"utama", emoji:"🥬", name:"Ca Kangkung", desc:"Cah kangkung segar", price:15000 },
  { id:"u5", cat:"utama", emoji:"🥬", name:"Ca Toge", desc:"Cah toge segar", price:15000 },
  { id:"s1", cat:"sterofom", emoji:"🍱", name:"Paket 1", desc:"Nasi + Ayam", price:24000 },
  { id:"s2", cat:"sterofom", emoji:"🍱", name:"Paket 2", desc:"Nasi + Ayam + Tahu/Tempe", price:27000 },
  { id:"s3", cat:"sterofom", emoji:"🍱", name:"Paket 3", desc:"Nasi + Ayam + Sayur Asem", price:27000 },

/* Writes ONLY this one order's own node (orders/{id}), never the whole
   orders tree. This is what keeps simultaneous orders from different
   customers safe: each order lives at its own path, so two people placing
   orders at the same second can never overwrite each other's data. */

   kitchenStatus, or only paymentStatus) — safer still than rewriting the
   whole order when only a small part of it changed. */

  if(cache.orders && cache.orders[orderId]) Object.assign(cache.orders[orderId], fields);

function distanceMeters(lat1, lon1, lat2, lon2){
  const R = 6371000, toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function resizeImageFileTo(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/png', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function escapeHtml(str){

     juga di hari Minggu pukul 23:59 WIB.
   Karena app ini statis (tanpa server/cron), pengecekan jadwal dijalankan
   setiap kali ada yang membuka aplikasi (pelanggan/dapur/kasir) — begitu
   waktunya sudah lewat, penghapusan langsung dijalankan saat itu juga oleh
   pengunjung/pengguna yang pertama membuka app setelah jam tersebut. Ini
   bukan cron server yang presisi ke detik, tapi cukup untuk menjaga
   database tetap ringan. WIB = UTC+7 sepanjang tahun (tidak ada DST). */
function wibDateParts(date){
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone:'Asia/Jakarta', hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit', weekday:'short'
  });
  const map = {};
  fmt.formatToParts(date).forEach(p=>{ if(p.type!=='literal') map[p.type]=p.value; });
  return map;
}
const WIB_WEEKDAY_INDEX = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
/* Titik waktu (UTC ms) dari hari Minggu TERAKHIR yang sudah lewat, pukul
   23:59 WIB — beserta tanggal (1-31) hari Minggu itu, untuk menentukan
   apakah jatuh di periode promo (1-15) atau periode langganan (16-akhir). */
function lastSundayDeadlineWIB(now){
  const p = wibDateParts(now);
  const dow = WIB_WEEKDAY_INDEX[p.weekday];
  const todayMidUTC = Date.UTC(Number(p.year), Number(p.month)-1, Number(p.day));
  const sunday = new Date(todayMidUTC - dow*86400000);
  const sy = sunday.getUTCFullYear(), sm = sunday.getUTCMonth()+1, sd = sunday.getUTCDate();
  const deadlineInstant = Date.UTC(sy, sm-1, sd, 23-7, 59, 0); // 23:59 WIB -> UTC (WIB = UTC+7)
  return { deadlineInstant, sundayDateOfMonth: sd };
}
async function checkAutoWipeSchedule(){
  if(!firebaseReady) return;
  /* Dengan Security Rules yang membatasi penghapusan massal /orders hanya
     untuk staff (dapur/kasir) yang login, penghapusan otomatis ini juga
     HARUS dijalankan dari sesi staff yang sedang login — kalau dijalankan
     dari sesi pelanggan (yang tidak pernah login sebagai staff), Firebase
     akan menolaknya. Ini sekaligus jadi lapisan keamanan tambahan: pelanggan
     tidak lagi bisa memicu penghapusan seluruh riwayat transaksi. */
  if(!(isDapurUnlocked() || isKasirUnlocked())) return;
  try{
    const s = await getSettings();
    const aw = s.autoWipe || defaultSettings().autoWipe;
    if(!aw.enabled) return;
    const now = Date.now();
    const { deadlineInstant, sundayDateOfMonth } = lastSundayDeadlineWIB(new Date());
    if(now < deadlineInstant) return; // hari Minggu 23:59 WIB terakhir belum lewat
    if((aw.lastWipeAt||0) >= deadlineInstant) return; // sudah dihapus untuk periode Minggu ini
    const isPromoHalf = sundayDateOfMonth <= 15; // tanggal 1-15 = mingguan, 16-akhir = 2 mingguan
    if(!isPromoHalf){
      const daysSinceLast = (now - (aw.lastWipeAt||0)) / 86400000;
      if(daysSinceLast < 14) return; // belum genap 2 minggu sejak penghapusan terakhir
    }
    await db.ref('orders').remove();
    await db.ref('settings/autoWipe').update({ lastWipeAt: now });
    cache.settings = Object.assign({}, cache.settings, { autoWipe: Object.assign({}, aw, {lastWipeAt: now}) });
    cache.orders = {};
    if(['status','kitchen','cashier','riwayat','beranda'].includes(state.view)) render();
  }catch(e){ console.error('Auto-hapus transaksi gagal:', e); }
}

/* ============ ROUTING ON LOAD ============ */
function parseEntryHash(){
  const h = location.hash.replace('#','');
  let intendedView = null;

  if(/^meja\d+$/.test(h)){
    const n = h.replace('meja','');
    state.order = newDraftOrder('dinein', 'Meja ' + n);
    intendedView = 'menu';
  } else if(h === 'takeaway'){
    state.order = newDraftOrder('takeaway', null);
    intendedView = 'menu';
  } else if(h === 'group'){
    state.order = newDraftOrder('group', null);
    intendedView = 'groupSize';
  } else if(h === 'dapur'){
    state.view = isDapurUnlocked() ? 'kitchen' : 'pinDapur'; return;
  } else if(h === 'kasir'){
    state.view = isKasirUnlocked() ? 'cashier' : 'pinKasir'; return;
  } else if(h === 'staff'){
    state.view = 'home'; return;
  } else {
    intendedView = 'beranda';
  }

  const profile = getCustomerProfile();
  if(!profile || !profile.name || !profile.phone){
    state.pendingView = intendedView;
    state.view = 'onboarding';
    return;
  }
  if(!hasSeenStory()){
    state.pendingView = intendedView;
    state.view = 'story';
    return;
  }
  state.view = intendedView;
}

function formatBookingDateTime(o){
  if(!o.bookingDate) return '';
  try{
    const d = new Date(o.bookingDate + 'T00:00:00');
    const dateStr = d.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
    return o.bookingTime ? `${dateStr}, ${o.bookingTime}` : dateStr;
  }catch(e){ return ''; }
}
function orderTypeLabel(o){
  if(o.orderType==='dinein') return `Dine In · ${o.tableCode}`;
  if(o.orderType==='takeaway') return 'Take Away';
  if(o.orderType==='group') return `Group Booking · ${o.groupSize} orang · 📅 ${formatBookingDateTime(o)}`;
  return '';
}
function cartCount(o){
  return Object.values(o.items).reduce((a,it)=>a+it.qty,0);
}
function cartTotal(o){
  let t=0;
  for(const id in o.items){
    const m = findMenuItem(id);
    if(m) t += m.price * o.items[id].qty;
  }
  return t;
}

function renderGeoResult(){
  if(!state.geoResult) return '';
  if(state.geoResult.ok){
    return `<div class="banner ok" style="margin-top:10px;">✅ Lokasi terverifikasi. Anda bisa lanjutkan pesanan dengan pembayaran tunai 🙌</div>`;
  } else if(state.geoResult.error){
    return `<div class="banner warn" style="margin-top:10px;">📍 Izin lokasi diperlukan. Mohon aktifkan izin lokasi di HP Anda, lalu tap tombol di atas sekali lagi.</div>`;
  } else {
    return `<div class="banner warn" style="margin-top:10px;">
      Sepertinya Anda belum berada di lokasi resto. Yuk menuju ke sini dulu ya 😊<br><br>
      <a href="${mapsLink()}" target="_blank">🗺️ Buka Lokasi Resto di Google Maps</a><br><br>
      Atau pilih <b>Transfer Bank</b> / <b>E-Wallet</b> untuk pesan dari mana saja.
    </div>`;
  }
}
function canSubmitOrder(geoOn){
  const o = state.order;
  if(!o.paymentMethod) return false;
  if(o.paymentMethod==='transfer' || o.paymentMethod==='ewallet' || o.paymentMethod==='qris'){
    if(!state.proofPreview) return false;
    if(o.paymentMethod==='ewallet' && !o.ewalletProvider) return false;
    return true;
  }
  if(o.paymentMethod==='cash'){
    if(geoOn===false) return true;
    return !!(state.geoResult && state.geoResult.ok);
  }
  return false;
}

  return '';

async function renderCashierPelanggan(){

      byPhone[o.customerPhone] = { name: o.customerName, phone: o.customerPhone, orderCount: 0, totalSpend: 0, lastOrderAt: 0 };

/* ============ TAB TITLE BLINK (lightweight background alert) ============ */
const ORIGINAL_TITLE = document.title;
let titleBlinkInterval = null;
function startTitleBlink(message){
  if(titleBlinkInterval) return; // already blinking
  let showAlt = true;
  titleBlinkInterval = setInterval(()=>{
    document.title = showAlt ? message : ORIGINAL_TITLE;
    showAlt = !showAlt;
  }, 1500);
}
function stopTitleBlink(){
  if(titleBlinkInterval){ clearInterval(titleBlinkInterval); titleBlinkInterval = null; }
  document.title = ORIGINAL_TITLE;
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden) stopTitleBlink();
});

function playNotifSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    function tone(freq, start, dur, vol){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now+start);
      gain.gain.linearRampToValueAtTime(vol, now+start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now+start+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+start); osc.stop(now+start+dur+0.05);
    }
    tone(880, 0, 0.18, 0.4);
    tone(1175, 0.15, 0.32, 0.4);
  }catch(e){ /* audio not available/allowed — ignore */ }
}
let kitchenKnownOrders = {};
let kitchenSoundPrimed = false;
function checkKitchenSound(orders){
  let shouldRing = false;
  Object.values(orders).forEach(o=>{
    const prev = kitchenKnownOrders[o.id];
    if(!prev){
      if(kitchenSoundPrimed) shouldRing = true;
    } else if((o.addonAt||0) > (prev.addonAt||0)){
      shouldRing = true;
    }
    kitchenKnownOrders[o.id] = { addonAt: o.addonAt||0 };
  });
  kitchenSoundPrimed = true;
  if(shouldRing) playNotifSound();
}

function generateQRCodes(){
  const base = location.origin + location.pathname;
  for(let i=1;i<=TABLE_COUNT;i++){
    const el = document.getElementById('qrcell-meja'+i);
    if(el && !el.dataset.rendered){
      new QRCode(el, { text: base+'#meja'+i, width:90, height:90 });
      el.dataset.rendered = '1';
      el.innerHTML += `<b>Meja ${i}</b>`;
    }
  }
  const t = document.getElementById('qrcell-takeaway');
  if(t && !t.dataset.rendered){ new QRCode(t, {text: base+'#takeaway', width:90, height:90}); t.dataset.rendered='1'; t.innerHTML += '<b>Take Away</b>'; }
  const g = document.getElementById('qrcell-group');
  if(g && !g.dataset.rendered){ new QRCode(g, {text: base+'#group', width:90, height:90}); g.dataset.rendered='1'; g.innerHTML += '<b>Group Booking</b>'; }
}

/* ============ CAMERA QR SCANNER ============ */
let scanStream = null;
let scanRAF = null;
function stopScanCamera(){
  if(scanRAF) cancelAnimationFrame(scanRAF);
  scanRAF = null;
  if(scanStream){
    scanStream.getTracks().forEach(t=>t.stop());
    scanStream = null;
  }
}
async function startScanCamera(){
  const video = document.getElementById('scanVideo');
  const statusEl = document.getElementById('scanStatus');
  if(!video) return;
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scanStream;
    await video.play();
    if(statusEl) statusEl.textContent = 'Arahkan kamera ke barcode meja...';
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    function tick(){
      if(!scanStream) return; // scanning was stopped (view changed)
      if(!video.videoWidth){ scanRAF = requestAnimationFrame(tick); return; }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if(code && code.data){
        stopScanCamera();
        handleScannedText(code.data);
        return;
      }
      scanRAF = requestAnimationFrame(tick);
    }
    scanRAF = requestAnimationFrame(tick);
  }catch(e){
    if(statusEl) statusEl.textContent = 'Tidak bisa mengakses kamera. Coba pilih manual di bawah, atau izinkan akses kamera di pengaturan browser.';
  }
}
function handleScannedText(text){
  let hash = '';
  try{
    const url = new URL(text);
    hash = url.hash.replace('#','');
  }catch(e){
    hash = text.replace('#','');
  }
  location.hash = hash;
  parseEntryHash();
  render();
}

/* ============ GOOGLE LOGIN (CUSTOMER) ============ */
/* Banyak browser HP (in-app browser Instagram/FB, Safari mode privat, dll)
   memblokir signInWithPopup secara diam-diam atau melempar
   'auth/popup-blocked' / 'auth/operation-not-supported-in-this-environment'.
   Supaya login Google tetap jalan di HP, coba POPUP dulu, dan kalau itu
   gagal karena diblokir, otomatis pindah ke signInWithRedirect (pindah
   halaman penuh ke Google, tanpa butuh popup/cookie pihak ketiga). Karena
   redirect me-reload seluruh halaman, status "sedang login Google" perlu
   dititipkan ke sessionStorage supaya selamat melewati reload itu — lalu
   dibaca lagi & diproses di bagian INIT di bawah. */
const PENDING_GOOGLE_CUSTOMER_KEY = 'kmf_pending_google_customer';
function safeSessionGet(key){ try{ return sessionStorage.getItem(key); }catch(e){ return null; } }
function safeSessionSet(key, val){ try{ sessionStorage.setItem(key, val); }catch(e){ /* ignore */ } }
function safeSessionRemove(key){ try{ sessionStorage.removeItem(key); }catch(e){ /* ignore */ } }

function googleLoginErrorMessage(e){
  const known = {
    'auth/operation-not-allowed': 'Provider Google belum diaktifkan di Firebase Console (Authentication > Sign-in method > Google). Aktifkan dulu provider-nya.',
    'auth/unauthorized-domain': 'Domain situs ini belum diizinkan untuk login Google (Firebase Console > Authentication > Settings > Authorized domains). Tambahkan domain situs Anda di sana.',
    'auth/api-key-not-valid': 'API key Firebase pada firebaseConfig tidak valid. Periksa kembali salinan konfigurasi Firebase-nya.',
    'auth/network-request-failed': 'Koneksi internet bermasalah saat menghubungi Google. Coba lagi.',
    'auth/internal-error': 'Terjadi kesalahan internal dari Google/Firebase. Coba lagi sebentar lagi.'
  };
  return known[e && e.code] || ((e && (e.message || e.code)) || 'terjadi kesalahan tak terduga.');
}

async function handleGoogleUserResult(user){
  const key = emailKey(user.email); // kunci stabil berdasarkan email, bukan UID
  const link = await getGoogleLink(key);
  if(link && link.phone){
    // Sudah diaktifkan resto sebelumnya — langsung masuk tanpa isi manual.
    saveCustomerProfile({ name: link.name, phone: link.phone, googleEmail: link.googleEmail });
    state.googleLoginBusy = false;
    if(!hasSeenStory()){
      state.pendingView = 'beranda';
      setView('story');
    } else {
      setView(state.pendingView || 'beranda');
    }
    return;
  }
  // Belum diaktifkan — catat sebagai permintaan menunggu, biarkan
  // pelanggan tetap isi nama & nomor WA seperti biasa di bawah.
  await saveGoogleRequest(key, {
    googleEmail: user.email || '',
    googleName: user.displayName || '',
    googlePhoto: user.photoURL || '',
    googleUid: user.uid,
    customerName: '', customerPhone: '',
    status: 'pending',
    requestedAt: Date.now()
  });
  state.googleLoginPendingUid = key;
  setPendingGoogleKey(key); // cadangan tahan-reload — lihat catatan di getPendingGoogleKey()
  state.googleLoginBusy = false;
  render();
  const nameInput = document.getElementById('onbName');
  if(nameInput && user.displayName) nameInput.value = user.displayName;
  alert('Permintaan Login Google terkirim. Menunggu diaktifkan resto — silakan lanjutkan isi Nama & No. WA di bawah untuk memesan sekarang.');
}

async function googleLoginCustomer(){
  if(!firebaseReady){
    alert('Login Google belum tersedia — Firebase belum dikonfigurasi (cek firebaseConfig).');
    return;
  }
  if(typeof firebase.auth === 'undefined' || !firebase.auth.GoogleAuthProvider){
    alert('Login Google belum tersedia — SDK Firebase Auth gagal dimuat. Periksa koneksi internet Anda lalu muat ulang halaman.');
    return;
  }
  state.googleLoginBusy = true; render();
  const provider = new firebase.auth.GoogleAuthProvider();
  try{
    const result = await auth.signInWithPopup(provider);
    await handleGoogleUserResult(result.user);
  }catch(e){
    console.error('Google login error:', e);
    const needsRedirectFallback = ['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code);
    if(needsRedirectFallback){
      try{
        safeSessionSet(PENDING_GOOGLE_CUSTOMER_KEY, '1');
        await auth.signInWithRedirect(provider);
        return; // halaman akan reload; hasilnya diproses di bagian INIT
      }catch(e2){
        safeSessionRemove(PENDING_GOOGLE_CUSTOMER_KEY);
        state.googleLoginBusy = false; render();
        alert('Gagal masuk dengan Google: ' + googleLoginErrorMessage(e2));
        return;
      }
    }
    state.googleLoginBusy = false;
    render();
    if(e.code !== 'auth/popup-closed-by-user'){
      alert('Gagal masuk dengan Google: ' + googleLoginErrorMessage(e));
    }
  }
}

/* Dipanggil sekali saat halaman terbuka (lihat bagian INIT paling bawah) —
   menangani hasil login Google yang datang lewat redirect (bukan popup). */
async function handlePendingGoogleRedirect(){
  if(!firebaseReady || !safeSessionGet(PENDING_GOOGLE_CUSTOMER_KEY)) return;
  try{
    const result = await auth.getRedirectResult();
    safeSessionRemove(PENDING_GOOGLE_CUSTOMER_KEY);
    if(result && result.user){
      state.googleLoginBusy = false;
      await handleGoogleUserResult(result.user);
    }
  }catch(e){
    console.error('Google redirect result error:', e);
    safeSessionRemove(PENDING_GOOGLE_CUSTOMER_KEY);
    state.googleLoginBusy = false;
    render();
    alert('Gagal masuk dengan Google: ' + googleLoginErrorMessage(e));
  }
}

/* ============ EVENT HANDLING ============ */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='go'){ setView(el.dataset.view); return; }

  if(action==='googleLogin'){ await googleLoginCustomer(); return; }

  if(action==='switchAccount'){
    const ok = confirm('Ganti akun akan menghapus nama & nomor WA yang tersimpan di HP/perangkat ini. Lanjutkan?');
    if(!ok) return;
    try{ localStorage.removeItem('kmf_customer_profile'); }catch(e){ /* ignore */ }
    setPendingGoogleKey(null);
    location.hash = '';
    parseEntryHash();
    render();
    return;
  }

  if(action==='exitStaffPortal'){
    location.hash = '';
    parseEntryHash();
    render();
    return;
  }

  if(action==='enterDapur'){
    location.hash = 'dapur';
    parseEntryHash();
    render();
    return;
  }
  if(action==='enterKasir'){
    location.hash = 'kasir';
    parseEntryHash();
    render();
    return;
  }
  if(action==='submitPinDapur'){
    const pass = document.getElementById('pinDapurInput').value;
    const errEl = document.getElementById('pinDapurError');
    if(!pass){ if(errEl) errEl.textContent = 'Mohon isi kata sandi.'; return; }
    try{
      await auth.signInWithEmailAndPassword(DAPUR_EMAIL, pass);
      setView('kitchen');
    }catch(e){
      if(errEl) errEl.textContent = 'Kata sandi salah, atau akun Dapur belum dibuat di Firebase Console.';
    }
    return;
  }
  if(action==='submitPinKasir'){
    const pass = document.getElementById('pinKasirInput').value;
    const errEl = document.getElementById('pinKasirError');
    if(!pass){ if(errEl) errEl.textContent = 'Mohon isi kata sandi.'; return; }
    try{
      await auth.signInWithEmailAndPassword(KASIR_EMAIL, pass);
      setView('cashier');
    }catch(e){
      if(errEl) errEl.textContent = 'Kata sandi salah, atau akun Kasir belum dibuat di Firebase Console.';
    }
    return;
  }
  if(action==='logoutDapur'){
    if(auth) await auth.signOut();
    location.hash = 'staff';
    setView('home');
    return;
  }
  if(action==='logoutKasir'){
    if(auth) await auth.signOut();
    location.hash = 'staff';
    setView('home');
    return;
  }

  if(action==='saveOnboarding'){
    const name = document.getElementById('onbName').value.trim();
    const phone = document.getElementById('onbPhone').value.trim();
    if(!name){ alert('Mohon isi nama Anda.'); return; }
    if(!phone || phone.length<9){ alert('Mohon isi nomor WhatsApp yang valid.'); return; }
    saveCustomerProfile({name, phone});
    // Kalau ada permintaan Google login yang baru saja dibuat, lengkapi
    // datanya dengan nama & nomor WA supaya resto punya info lengkap saat
    // Activate. Pakai state di memori DULU, tapi kalau sudah hilang
    // (mis. tab sempat reload di tengah proses), pakai cadangan dari
    // localStorage supaya tetap nyambung ke permintaan yang benar.
    const pendingKey = state.googleLoginPendingUid || getPendingGoogleKey();
    if(pendingKey){
      const reqs = await getGoogleRequests();
      const r = reqs[pendingKey];
      if(r){
        r.customerName = name; r.customerPhone = phone;
        await saveGoogleRequest(pendingKey, r);
      }
      setPendingGoogleKey(null);
      state.googleLoginPendingUid = null;
    }
    if(!hasSeenStory()){
      setView('story');
    } else {
      setView(state.pendingView || 'beranda');
    }
    return;
  }
  if(action==='continueFromStory'){
    markStorySeen();
    setView(state.pendingView || 'beranda');
    return;
  }
  if(action==='saveProfil'){
    const name = document.getElementById('profName').value.trim();
    const phone = document.getElementById('profPhone').value.trim();
    if(!name){ alert('Mohon isi nama Anda.'); return; }
    if(!phone || phone.length<9){ alert('Mohon isi nomor WhatsApp yang valid.'); return; }
    const prev = getCustomerProfile() || {};
    saveCustomerProfile(Object.assign({}, prev, {name, phone}));
    alert('Profil berhasil disimpan.');
    setView('beranda'); return;
  }
  if(action==='viewRiwayatDetail'){
    const all = await getAllOrders();
    const o = all[el.dataset.id];
    if(o){ state.createdOrder = o; setView('status'); }
    return;
  }
  if(action==='setReviewStar'){
    state.reviewRating = parseInt(el.dataset.n, 10);
    render();
    return;
  }
  if(action==='submitReview'){
    const orderId = el.dataset.id;
    const rating = state.reviewRating;
    if(!rating) return;
    const all = await getAllOrders();
    const o = all[orderId];
    if(!o) return;
    const review = {
      orderId,
      customerName: o.customerName,
      customerPhone: o.customerPhone,
      rating,
      comment: state.reviewComment || '',
      createdAt: Date.now()
    };
    await saveReview(review);
    state.reviewRating = 0;
    state.reviewComment = '';
    render();
    return;
  }
  if(action==='sendNotif'){
    const textEl = document.getElementById('notifText');
    const message = textEl ? textEl.value.trim() : '';
    if(!message){ alert('Tulis dulu pesan notifikasinya.'); return; }
    if(firebaseReady){
      try{
        await db.ref('notifications').push({ message, createdAt: Date.now() });
        alert('Notifikasi terkirim ke semua pelanggan.');
        if(textEl) textEl.value = '';
        render();
      }catch(e){ alert('Gagal mengirim notifikasi. Coba lagi.'); }
    }
    return;
  }
  if(action==='printDailyReport'){
    const all = await getAllOrders();
    printDailyReport(all);
    return;
  }
  if(action==='activateGoogle'){
    const uid = el.dataset.uid;
    const reqs = await getGoogleRequests();
    const r = reqs[uid];
    if(!r){ alert('Data permintaan tidak ditemukan.'); return; }
    const phoneInput = document.getElementById('greqPhone_' + uid);
    const phoneValue = phoneInput ? phoneInput.value.trim() : (r.customerPhone || '');
    if(!phoneValue || phoneValue.length<9){
      alert('Isi dulu nomor WA pelanggan yang benar di kolom di atas sebelum tap Activate.');
      return;
    }
    r.customerPhone = phoneValue;
    const ok = await activateGoogleRequest(uid, r);
    if(ok){
      alert('Login Google untuk '+(r.customerName||r.googleName)+' berhasil diaktifkan.');
    } else {
      alert('Gagal menyimpan aktivasi ke server (kemungkinan koneksi terputus). Coba tap Activate sekali lagi.');
    }
    render();
    return;
  }

  if(action==='scanTable'){
    location.hash = 'meja'+el.dataset.n;
    state.order = newDraftOrder('dinein', 'Meja '+el.dataset.n);
    setView('menu'); return;
  }
  if(action==='scanTakeaway'){
    location.hash = 'takeaway';
    state.order = newDraftOrder('takeaway', null);
    setView('menu'); return;
  }
  if(action==='scanGroup'){
    location.hash = 'group';
    state.order = newDraftOrder('group', null);
    setView('groupSize'); return;
  }
  if(action==='confirmGroupSize'){
    const val = parseInt(document.getElementById('groupSizeInput').value, 10);
    const bookingDate = document.getElementById('bookingDateInput').value;
    const bookingTime = document.getElementById('bookingTimeInput').value;
    if(!val || val < 10){ alert('Jumlah rombongan minimal 10 orang.'); return; }
    if(!bookingDate){ alert('Mohon isi tanggal booking.'); return; }
    if(!bookingTime){ alert('Mohon isi jam booking.'); return; }
    state.order.groupSize = val;
    state.order.bookingDate = bookingDate;
    state.order.bookingTime = bookingTime;
    setView('menu'); return;
  }
  if(action==='setCategory'){ state.category = el.dataset.cat; render(); return; }
  if(action==='qtyInc'){
    const id = el.dataset.id;
    const availability = await getMenuAvailability();
    if(!isMenuItemAvailable(availability, id)){ alert('Maaf, menu ini sedang habis.'); render(); return; }
    if(!state.order.items[id]) state.order.items[id] = {qty:0, note:''};
    state.order.items[id].qty++;
    render(); return;
  }
  if(action==='qtyDec'){
    const id = el.dataset.id;
    if(state.order.items[id]){
      state.order.items[id].qty--;
      if(state.order.items[id].qty<=0) delete state.order.items[id];
    }
    render(); return;
  }
  if(action==='submitInfo'){
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    if(!name){ alert('Mohon isi nama Anda.'); return; }
    if(!phone || phone.length<9){ alert('Mohon isi nomor WhatsApp yang valid.'); return; }
    state.order.customerName = name;
    state.order.customerPhone = phone;
    const prevProfile = getCustomerProfile() || {};
    saveCustomerProfile(Object.assign({}, prevProfile, {name, phone}));
    setView('payment'); return;
  }
  if(action==='setMethod'){
    state.order.paymentMethod = el.dataset.m;
    state.geoResult = null; state.proofPreview = null;
    render(); return;
  }
  if(action==='setEwallet'){ state.order.ewalletProvider = el.dataset.p; render(); return; }
  if(action==='checkGeo'){
    state.geoChecking = true; render();
    if(!navigator.geolocation){
      state.geoResult = {ok:false, error:'Geolocation tidak didukung perangkat ini'};
      state.geoChecking = false; render(); return;
    }
    const s = await getSettings();
    const geo = s.geofence || defaultSettings().geofence;
    navigator.geolocation.getCurrentPosition(pos=>{
      const d = distanceMeters(pos.coords.latitude, pos.coords.longitude, geo.lat, geo.lng);
      state.geoResult = { ok: d <= geo.radius, distance: d };
      state.geoChecking = false; render();
    }, err=>{
      state.geoResult = {ok:false, error: err.message || 'Izin lokasi ditolak'};
      state.geoChecking = false; render();
    }, {enableHighAccuracy:true, timeout:12000});
    return;
  }
  if(action==='placeOrder'){
    const s = await getSettings();
    const geoOn = s.geofence && s.geofence.enabled !== false;
    if(!canSubmitOrder(geoOn)) return;
    if(state.isSubmittingOrder) return; // guard against double-tap creating duplicate orders
    state.isSubmittingOrder = true;
    render();
    try{
      const o = state.order;
      const queueNumber = await nextQueueNumber();
      const id = 'ord_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      const total = cartTotal(o);
      const finalOrder = {
        id, queueNumber,
        orderType: o.orderType, tableCode: o.tableCode, groupSize: o.groupSize,
        bookingDate: o.bookingDate || null, bookingTime: o.bookingTime || null,
        items: o.items, total,
        customerName: o.customerName, customerPhone: o.customerPhone,
        paymentMethod: o.paymentMethod, ewalletProvider: o.ewalletProvider,
        paymentProof: state.proofPreview || null,
        paymentStatus: o.paymentMethod==='cash' ? 'belum_bayar' : 'menunggu',
        kitchenStatus: 'diterima',
        createdAt: Date.now()
      };
      await saveOrder(finalOrder);
      state.createdOrder = finalOrder;
      state.proofPreview = null;
      state.isSubmittingOrder = false;
      setView('confirm');
    }catch(e){
      state.isSubmittingOrder = false;
      alert('Gagal membuat pesanan, coba lagi.');
      render();
    }
    return;
  }
  if(action==='kitchenAdvance'){
    const all = await getAllOrders();
    const o = all[el.dataset.id];
    if(o){
      let newStatus = o.kitchenStatus;
      if(o.kitchenStatus==='diterima') newStatus='dimasak';
      else if(o.kitchenStatus==='dimasak') newStatus='selesai';
      const fields = { kitchenStatus: newStatus, hasAddon: false };
      if(newStatus==='selesai') fields.selesaiAt = Date.now();
      await updateOrderFields(o.id, fields);
    }
    render(); return;
  }
  if(action==='ackAddon'){
    await updateOrderFields(el.dataset.id, { hasAddon: false });
    render(); return;
  }
  if(action==='openAddon'){
    state.addonOrderId = el.dataset.id;
    state.addonItems = {};
    state.category = 'sterofom';
    setView('cashierAddItem');
    return;
  }
  if(action==='cancelAddon'){
    state.addonOrderId = null;
    state.addonItems = {};
    setView('cashier');
    return;
  }
  if(action==='addonQtyInc'){
    const id = el.dataset.id;
    const availability = await getMenuAvailability();
    if(!isMenuItemAvailable(availability, id)){ alert('Maaf, menu ini sedang habis.'); render(); return; }
    if(!state.addonItems[id]) state.addonItems[id] = { qty:0 };
    state.addonItems[id].qty++;
    render(); return;
  }
  if(action==='addonQtyDec'){
    const id = el.dataset.id;
    if(state.addonItems[id]){
      state.addonItems[id].qty--;
      if(state.addonItems[id].qty<=0) delete state.addonItems[id];
    }
    render(); return;
  }
  if(action==='confirmAddon'){
    const addonIds = Object.keys(state.addonItems);
    if(addonIds.length===0) return;
    const all = await getAllOrders();
    const o = all[state.addonOrderId];
    if(!o){ alert('Pesanan tidak ditemukan.'); setView('cashier'); return; }
    addonIds.forEach(id=>{
      if(o.items[id]) o.items[id].qty += state.addonItems[id].qty;
      else o.items[id] = { qty: state.addonItems[id].qty, note: '' };
    });
    o.total = cartTotal({ items: o.items });
    o.hasAddon = true;
    o.addonAt = Date.now();
    if(o.paymentMethod==='cash' && o.paymentStatus==='lunas') o.paymentStatus = 'belum_bayar';
    else if((o.paymentMethod==='transfer'||o.paymentMethod==='ewallet') && o.paymentStatus==='disetujui') o.paymentStatus = 'menunggu';
    await saveOrder(o);
    const queueNumber = o.queueNumber, newTotal = o.total;
    state.addonOrderId = null;
    state.addonItems = {};
    setView('cashier');
    alert('Item tambahan berhasil ditambahkan ke pesanan #'+queueNumber+'. Total baru: '+rupiah(newTotal));
    return;
  }
  if(action==='cashierTab'){ state.cashierTab = el.dataset.t; render(); return; }
  if(action==='cashierApprove'){
    const all = await getAllOrders();
    const o = all[el.dataset.id];
    if(o){
      await updateOrderFields(o.id, { paymentStatus: o.paymentMethod==='cash' ? 'lunas' : 'disetujui' });
    }
    render(); return;
  }
  if(action==='printReceipt'){
    const all = await getAllOrders();
    printReceiptFor(all[el.dataset.id]);
    return;
  }
  if(action==='printQR'){ window.print(); return; }
  if(action==='viewProof'){
    const all = await getAllOrders();
    const o = all[el.dataset.id];
    if(o && o.paymentProof){ state.lightbox = o.paymentProof; render(); }
    return;
  }
  if(action==='closeLightbox'){ state.lightbox = null; render(); return; }
  if(action==='ignoreClick'){ return; }

  if(action==='toggleGeoForm'){ /* handled in change listener */ return; }
  if(action==='useMyLocationGeo'){
    if(!navigator.geolocation){ alert('Perangkat ini tidak mendukung layanan lokasi.'); return; }
    state.geoFormChecking = true; render();
    navigator.geolocation.getCurrentPosition(pos=>{
      state.geoFormLat = pos.coords.latitude;
      state.geoFormLng = pos.coords.longitude;
      state.geoFormChecking = false;
      render();
    }, err=>{
      state.geoFormChecking = false;
      alert('Gagal mengambil lokasi. Pastikan izin lokasi diaktifkan.');
      render();
    }, {enableHighAccuracy:true, timeout:12000});
    return;
  }
  if(action==='saveGeoSettings'){
    const lat = parseFloat(document.getElementById('geoLatInput').value);
    const lng = parseFloat(document.getElementById('geoLngInput').value);
    const radius = parseInt(document.getElementById('geoRadiusInput').value, 10);
    const enabled = document.getElementById('geoToggleForm').checked;
    if(enabled && (isNaN(lat) || isNaN(lng) || isNaN(radius) || radius<=0)){
      alert('Lengkapi latitude, longitude, dan radius dengan benar.');
      return;
    }
    await saveGeofenceSettings({ enabled, lat: lat||0, lng: lng||0, radius: radius||DEFAULT_GEOFENCE_TOLERANCE_M });
    state.geoFormEnabled = null; state.geoFormLat = null; state.geoFormLng = null; state.geoFormRadius = null;
    alert('Pengaturan geofencing tersimpan.');
    render();
    return;
  }
  if(action==='saveLogo'){
    if(!state.logoPreview){ return; }
    await saveLogoUrl(state.logoPreview);
    state.logoPreview = null;
    alert('Logo resto tersimpan.');
    render();
    return;
  }
  if(action==='saveQris'){
    if(!state.qrisPreview){ return; }
    await saveQrisImage(state.qrisPreview);
    state.qrisPreview = null;
    alert('QRIS tersimpan. Opsi pembayaran QRIS sekarang muncul untuk pelanggan.');
    render();
    return;
  }
  if(action==='removeQris'){
    const ok = confirm('Hapus QRIS? Opsi pembayaran QRIS akan hilang dari pilihan pelanggan sampai diupload lagi.');
    if(!ok) return;
    await saveQrisImage(null);
    alert('QRIS dihapus.');
    render();
    return;
  }
  if(action==='savePaymentInfo'){
    const info = {
      bank1Name: document.getElementById('pi_bank1Name').value.trim(),
      bank1Number: document.getElementById('pi_bank1Number').value.trim(),
      bank2Name: document.getElementById('pi_bank2Name').value.trim(),
      bank2Number: document.getElementById('pi_bank2Number').value.trim(),
      bankHolder: document.getElementById('pi_bankHolder').value.trim(),
      ewalletNumber: document.getElementById('pi_ewalletNumber').value.trim(),
      ewalletHolder: document.getElementById('pi_ewalletHolder').value.trim()
    };
    if(!info.bank1Name || !info.bank1Number || !info.bankHolder || !info.ewalletNumber || !info.ewalletHolder){
      alert('Mohon lengkapi minimal Bank 1, Nama Pemilik Rekening, Nomor & Nama Pemilik E-Wallet.');
      return;
    }
    await savePaymentInfo(info);
    alert('Info pembayaran tersimpan.');
    render();
    return;
  }
  if(action==='saveReviewLink'){
    const link = document.getElementById('reviewLinkInput').value.trim();
    if(!link){ alert('Mohon isi link ulasan Google Maps.'); return; }
    await saveGoogleReviewLink(link);
    alert('Link ulasan Google Maps tersimpan.');
    render();
    return;
  }
  if(action==='manualWipeNow'){
    const ok = confirm('Yakin ingin menghapus SEMUA riwayat transaksi sekarang? Tindakan ini permanen dan tidak bisa dibatalkan.');
    if(!ok) return;
    try{
      if(firebaseReady) await db.ref('orders').remove();
      cache.orders = {};
      const now = Date.now();
      if(firebaseReady) await db.ref('settings/autoWipe').update({ lastWipeAt: now });
      cache.settings = Object.assign({}, cache.settings, { autoWipe: Object.assign({}, (cache.settings&&cache.settings.autoWipe)||{}, {lastWipeAt: now}) });
      alert('Semua riwayat transaksi berhasil dihapus.');
      render();
    }catch(e){ alert('Gagal menghapus transaksi. Coba lagi.'); }
    return;
  }

  if(action==='openAddMenuForm'){
    state.menuFormOpen = true; state.menuFormEditId = null; state.menuFormPhoto = null;
    render(); return;
  }
  if(action==='editMenuItem'){
    state.menuFormOpen = true; state.menuFormEditId = el.dataset.id; state.menuFormPhoto = null;
    render(); return;
  }
  if(action==='cancelMenuForm'){
    state.menuFormOpen = false; state.menuFormEditId = null; state.menuFormPhoto = null;
    render(); return;
  }
  if(action==='deleteMenuItem'){
    const id = el.dataset.id;
    const m = findMenuItem(id);
    const ok = confirm('Hapus menu "'+m.name+'"? Menu ini tidak akan bisa dipesan lagi. Pesanan lama yang sudah memuat menu ini tetap tersimpan seperti apa adanya.');
    if(!ok) return;
    const success = await deleteMenuItemFromDb(id);
    if(!success) alert('Gagal menghapus menu (kemungkinan koneksi terputus). Coba lagi.');
    render();
    return;
  }
  if(action==='saveMenuForm'){
    const editId = el.dataset.editid || null;
    if(!editId && MENU.length >= MAX_MENU_ITEMS){
      alert('Sudah mencapai batas maksimal '+MAX_MENU_ITEMS+' menu. Hapus salah satu menu dulu kalau ingin menambah menu baru.');
      return;
    }
    const cat = document.getElementById('menuFormCat').value;
    const name = document.getElementById('menuFormName').value.trim();
    const desc = document.getElementById('menuFormDesc').value.trim();
    const price = parseInt(document.getElementById('menuFormPrice').value, 10);
    if(!name){ alert('Mohon isi nama menu.'); return; }
    if(!price || price<=0){ alert('Mohon isi harga menu yang benar.'); return; }
    const catDefaultEmoji = { utama:'🍗', sterofom:'🍱', piring:'🍛' };
    const existing = editId ? MENU.find(m=>m.id===editId) : null;
    const item = {
      id: editId || ('m_' + Date.now() + '_' + Math.random().toString(36).slice(2,7)),
      cat, name, desc, price,
      emoji: existing ? existing.emoji : catDefaultEmoji[cat],
      photo: state.menuFormPhoto || (existing ? existing.photo : null),
      order: existing ? (existing.order||0) : MENU.length
    };
    const success = await saveMenuItemToDb(item);
    if(!success) alert('Gagal menyimpan menu (kemungkinan koneksi terputus). Coba lagi.');
    state.menuFormOpen = false; state.menuFormEditId = null; state.menuFormPhoto = null;
    render();
    return;
  }
  if(action==='saveTableCount'){
    const val = parseInt(document.getElementById('tableCountInput').value, 10);
    if(!val || val<1 || val>MAX_TABLE_COUNT){
      alert('Jumlah meja harus antara 1 sampai '+MAX_TABLE_COUNT+'.');
      return;
    }
    await setTableCount(val);
    alert('Jumlah meja tersimpan: '+val+' meja.');
    render();
    return;
  }
});

  }
  if(e.target.id==='autoWipeToggle'){
    await setAutoWipeEnabled(e.target.checked);
    render();
  }
  if(e.target.id==='geoToggleForm'){
    state.geoFormEnabled = e.target.checked;
  }
  if(e.target.id==='geoLatInput'){ state.geoFormLat = e.target.value; }
  if(e.target.id==='geoLngInput'){ state.geoFormLng = e.target.value; }
  if(e.target.id==='geoRadiusInput'){ state.geoFormRadius = e.target.value; }
  if(e.target.dataset && e.target.dataset.action==='toggleStok'){
    await setMenuAvailability(e.target.dataset.id, e.target.checked);
    render();
  }
});

document.addEventListener('input', (e)=>{
  if(e.target.classList && e.target.classList.contains('note-input')){
    const id = e.target.dataset.id;
    if(state.order && state.order.items[id]){
      state.order.items[id].note = e.target.value;
    }
  }
  if(e.target.id === 'reviewCommentInput'){
    state.reviewComment = e.target.value;
  }
});

/* ============ INIT ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* ignore if unavailable */ });
  });
}

parseEntryHash();
if(safeSessionGet(PENDING_GOOGLE_CUSTOMER_KEY)) state.googleLoginBusy = true;
render();
handlePendingGoogleRedirect();
checkAutoWipeSchedule();
setInterval(checkAutoWipeSchedule, 5 * 60 * 1000); // cek ulang tiap 5 menit selama app terbuka
if(supabaseReady){ loadNafaSubscription().then(()=>{ if(state.view==='cashier') render(); }); }
if(firebaseReady){
  getSettings(); // memuat TABLE_COUNT aktual (menimpa default 30) lalu render ulang bila relevan
  seedMenuItemsIfEmpty().then(subscribeMenuItems);
}

if(firebaseReady){
  auth.onAuthStateChanged((user)=>{
    currentAuthUser = user;
    authReady = true;
    const h = location.hash.replace('#','');
    // Re-evaluate dapur/kasir routing now that we know the real login state
    // (covers both: staff already logged in from before, and just logged out).
    if(h === 'dapur' || h === 'kasir' || state.view==='pinDapur' || state.view==='pinKasir' || state.view==='kitchen' || state.view==='cashier'){
      if(h === 'dapur' || h === 'kasir'){
        parseEntryHash();
        render();
      }
    }
  });
}

/* Real-time updates: whenever /orders or /settings changes in Firebase
   (from any device — customer, kitchen, or cashier), re-render the current
   live view automatically. Falls back to a light poll if Firebase isn't
   configured yet, so the app still works while you set that up. */
if(firebaseReady){
  db.ref('orders').on('value', ()=>{
    if(['status','kitchen','cashier','riwayat'].includes(state.view) && !state.lightbox) render();
  });
  db.ref('settings').on('value', (snap)=>{
    const v = snap.val() || {};
    TABLE_COUNT = v.tableCount || DEFAULT_TABLE_COUNT;
    if(state.view==='groupSize' || state.view==='beranda' || state.view==='scanSim' || (state.view==='cashier' && (state.cashierTab==='settings' || state.cashierTab==='qr'))) render();
  });
  db.ref('googleCustomerRequests').on('value', ()=>{
    if(state.view==='cashier' && state.cashierTab==='google') render();
  });
  let knownNotifIds = null;
  db.ref('notifications').on('value', (snap)=>{
    const v = snap.val() || {};
    const ids = Object.keys(v);
    if(knownNotifIds === null){
      knownNotifIds = new Set(ids); // first load — don't blink for pre-existing notifications
    } else {
      const isNew = ids.some(id => !knownNotifIds.has(id));
      knownNotifIds = new Set(ids);
      const staffViews = ['kitchen','cashier','cashierAddItem','pinDapur','pinKasir','home'];
      if(isNew && document.hidden && !staffViews.includes(state.view)){
        startTitleBlink('🔔 Ada info baru dari resto!');
      }
    }
    if(['beranda','notifikasi'].includes(state.view) && !state.lightbox) render();
  });
  db.ref('menuAvailability').on('value', ()=>{
    if(['menu','cashierAddItem'].includes(state.view) || (state.view==='cashier' && state.cashierTab==='stok')) render();
  });
  db.ref('reviews').on('value', ()=>{
    if(state.view==='status' || (state.view==='cashier' && state.cashierTab==='ulasan')) render();
  });
} else {
  setInterval(()=>{
    if(['status','kitchen','cashier','riwayat','beranda'].includes(state.view) && !state.lightbox){
      render();
    }
  }, 4000);
}
</script>
</body>
</html>
